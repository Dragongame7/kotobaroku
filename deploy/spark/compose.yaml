services:
  vllm:
    image: ${VLLM_IMAGE:?Set a tested Arm64 image with its digest}
    platform: linux/arm64
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    ipc: host
    entrypoint: [vllm, serve]
    environment:
      VLLM_API_KEY: ${GATEWAY_LLM_API_KEY:?Set the internal vLLM key}
      VLLM_NO_USAGE_STATS: "1"
    volumes:
      - ../../.runtime/huggingface:/root/.cache/huggingface
    command:
      - ${MODEL_ID:?Select the evaluated model}
      - --revision
      - ${MODEL_REVISION:?Pin the model revision}
      - --served-model-name
      - meeting-llm
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --max-model-len
      - "8192"
      - --max-num-seqs
      - "1"
      - --gpu-memory-utilization
      - "0.5"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
