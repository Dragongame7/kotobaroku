name: Windows client ZIP

on:
  workflow_dispatch:
    inputs:
      gateway_url:
        description: Shared DGX gateway URL (no API key; optional)
        required: false
        type: string
      model:
        description: Published LLM model name (optional)
        required: false
        type: string
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      CLIENT_GATEWAY_URL: ${{ inputs.gateway_url || vars.DGX_GATEWAY_URL }}
      CLIENT_MODEL: ${{ inputs.model || vars.DGX_LLM_MODEL }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24.22.0'
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Check tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node -e "if(process.env.RELEASE_TAG !== 'v'+require('./package.json').version)throw Error('Tag must match package.json version')"
      - name: Build portable ZIP
        shell: pwsh
        run: |
          $taskPackageArgs = @('scripts/package-client.mjs')
          if ($env:CLIENT_GATEWAY_URL) { $taskPackageArgs += @('--gateway-url', $env:CLIENT_GATEWAY_URL) }
          if ($env:CLIENT_MODEL) { $taskPackageArgs += @('--model', $env:CLIENT_MODEL) }
          node @taskPackageArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - run: npm run test:client-package
      - uses: actions/upload-artifact@v7
        with:
          name: windows-client
          path: |
            release/*.zip
            release/*.sha256
          if-no-files-found: error
          compression-level: 0
      - name: Create draft release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $taskAssets = @(Get-ChildItem -LiteralPath release -File | Where-Object { $_.Name -like '*.zip' -or $_.Name -like '*.sha256' } | ForEach-Object { $_.FullName })
          gh release create "$env:RELEASE_TAG" @taskAssets --draft --verify-tag --title "ことば録 $env:RELEASE_TAG" --notes-file deploy/client/release-notes.md
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
